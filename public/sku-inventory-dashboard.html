<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKU Inventory Dashboard - Hierarchical View</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .dashboard-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .dashboard-header {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .dashboard-title {
            font-size: 2.5rem;
            font-weight: 700;
            color: #2c3e50;
            margin-bottom: 10px;
            text-align: center;
        }

        .dashboard-subtitle {
            font-size: 1.1rem;
            color: #7f8c8d;
            text-align: center;
            margin-bottom: 30px;
        }

        .summary-cards {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .summary-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease;
        }

        .summary-card:hover {
            transform: translateY(-5px);
        }

        .summary-card h3 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .summary-card p {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        .filters-section {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .filters-title {
            font-size: 1.4rem;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 20px;
            text-align: center;
        }

        .filter-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .filter-group {
            display: flex;
            flex-direction: column;
        }

        .filter-group label {
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 5px;
            font-size: 0.9rem;
        }

        .filter-group select, .filter-group input {
            padding: 10px 12px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 0.9rem;
            transition: border-color 0.3s ease;
        }

        .filter-group select:focus, .filter-group input:focus {
            outline: none;
            border-color: #667eea;
        }

        .filter-actions {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #6c757d;
            color: white;
        }

        .btn-secondary:hover {
            background: #5a6268;
        }

        .inventory-section {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .section-title {
            font-size: 1.6rem;
            font-weight: 600;
            color: #2c3e50;
            margin-bottom: 20px;
            text-align: center;
        }

        .model-group {
            margin-bottom: 30px;
            border: 1px solid #e9ecef;
            border-radius: 12px;
            overflow: hidden;
            background: white;
        }

        .model-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.3s ease;
        }

        .model-header:hover {
            background: linear-gradient(135deg, #5a6fd8 0%, #6a4190 100%);
        }

        .model-header h3 {
            font-size: 1.4rem;
            font-weight: 600;
            margin: 0;
        }

        .model-stats {
            display: flex;
            gap: 20px;
            align-items: center;
        }

        .model-stat {
            text-align: center;
        }

        .model-stat-number {
            font-size: 1.8rem;
            font-weight: 700;
            display: block;
        }

        .model-stat-label {
            font-size: 0.8rem;
            opacity: 0.9;
        }

        .model-content {
            display: none;
            padding: 20px;
        }

        .model-content.expanded {
            display: block;
        }

        .capacity-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .capacity-tab {
            padding: 10px 20px;
            background: #f8f9fa;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-weight: 600;
            color: #495057;
        }

        .capacity-tab:hover {
            background: #e9ecef;
        }

        .capacity-tab.active {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-color: #667eea;
        }

        .capacity-content {
            display: none;
        }

        .capacity-content.active {
            display: block;
        }

        .carrier-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 15px;
        }

        .carrier-card {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 15px;
            transition: all 0.3s ease;
        }

        .carrier-card:hover {
            background: #e9ecef;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        /* Device Grid Styles */
        .device-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            padding: 20px 0;
        }

        .device-card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            border: 1px solid #e9ecef;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .device-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .device-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #f8f9fa;
        }

        .device-sku {
            font-weight: bold;
            font-size: 16px;
            color: #495057;
            font-family: 'Courier New', monospace;
        }

        .device-count {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .device-details {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .device-detail {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
        }

        .detail-label {
            font-weight: 600;
            color: #6c757d;
            font-size: 14px;
        }

        .detail-value {
            font-weight: 500;
            color: #495057;
            font-size: 14px;
        }

        .text-danger {
            color: #dc3545 !important;
        }

        .text-success {
            color: #28a745 !important;
        }

        /* SKU Card Styles */
        .sku-card {
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .sku-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);
            border: 2px solid #667eea;
        }

        .sku-click-hint {
            text-align: center;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid #e9ecef;
        }

        /* Carrier Popup Styles */
        .carrier-popup-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .carrier-popup {
            background: white;
            border-radius: 12px;
            padding: 0;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow: hidden;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .carrier-popup-header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .carrier-popup-header h3 {
            margin: 0;
            font-size: 18px;
            font-weight: 600;
        }

        .close-popup {
            background: none;
            border: none;
            color: white;
            font-size: 24px;
            cursor: pointer;
            padding: 0;
            width: 30px;
            height: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: background 0.3s ease;
        }

        .close-popup:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .carrier-popup-content {
            padding: 20px;
            max-height: 60vh;
            overflow-y: auto;
        }

        .carrier-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .carrier-item {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 15px;
            border-left: 4px solid #667eea;
        }

        .carrier-info {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .carrier-name {
            font-weight: 600;
            color: #495057;
            font-size: 16px;
        }

        .carrier-count {
            background: #667eea;
            color: white;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: bold;
        }

        .carrier-notes {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .notes-label {
            font-weight: 600;
            color: #6c757d;
            font-size: 12px;
        }

        .notes-value {
            color: #495057;
            font-size: 14px;
            background: white;
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #e9ecef;
        }

        .carrier-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .carrier-name {
            font-weight: 600;
            color: #2c3e50;
            font-size: 1.1rem;
        }

        .carrier-count {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 4px 12px;
            border-radius: 12px;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .carrier-details {
            font-size: 0.9rem;
            color: #6c757d;
        }

        .carrier-detail-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 5px;
        }

        .defective-badge {
            background: #ffebee;
            color: #c62828;
            padding: 2px 8px;
            border-radius: 8px;
            font-size: 0.8rem;
            font-weight: 600;
        }

        .loading-indicator {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }

        .error-message {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: center;
            display: none;
        }

        .success-message {
            background: #e8f5e8;
            color: #2e7d32;
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
            text-align: center;
            display: none;
        }

        .expand-icon {
            transition: transform 0.3s ease;
        }

        .expand-icon.expanded {
            transform: rotate(180deg);
        }

        @media (max-width: 768px) {
            .dashboard-container {
                padding: 10px;
            }
            
            .model-stats {
                flex-direction: column;
                gap: 10px;
            }
            
            .capacity-tabs {
                justify-content: center;
            }
            
            .carrier-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <!-- Header -->
        <div class="dashboard-header">
            <h1 class="dashboard-title">📱 SKU Inventory Dashboard</h1>
            <p class="dashboard-subtitle">Hierarchical View - Model → Capacity → Carrier</p>
            
            <!-- Summary Cards -->
            <div class="summary-cards">
                <div class="summary-card">
                    <h3 id="totalModels">-</h3>
                    <p>Total Models</p>
                </div>
                <div class="summary-card">
                    <h3 id="totalDevices">-</h3>
                    <p>Total Devices</p>
                </div>
                <div class="summary-card">
                    <h3 id="totalDefective">-</h3>
                    <p>Defective Units</p>
                </div>
                <div class="summary-card">
                    <h3 id="defectiveRate">-</h3>
                    <p>Defective Rate</p>
                </div>
            </div>
        </div>

        <!-- Filters -->
        <div class="filters-section">
            <h2 class="filters-title">🔍 Filter Options</h2>
            <div class="filter-row">
                <div class="filter-group">
                    <label for="brandFilter">Brand</label>
                    <select id="brandFilter">
                        <option value="">All Brands</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="modelFilter">Model</label>
                    <select id="modelFilter">
                        <option value="">All Models</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="capacityFilter">Capacity</label>
                    <select id="capacityFilter">
                        <option value="">All Capacities</option>
                    </select>
                </div>
                <div class="filter-group">
                    <label for="carrierFilter">Carrier</label>
                    <select id="carrierFilter">
                        <option value="">All Carriers</option>
                    </select>
                </div>
            </div>
            <div class="filter-actions">
                <button class="btn btn-primary" onclick="applyFilters()">Apply Filters</button>
                <button class="btn btn-secondary" onclick="clearFilters()">Clear All</button>
            </div>
        </div>

        <!-- Inventory Display -->
        <div class="inventory-section">
            <h2 class="section-title">📊 Inventory by Model</h2>
            
            <div id="loadingIndicator" class="loading-indicator">
                <p>🔄 Loading inventory data...</p>
            </div>
            
            <div id="errorMessage" class="error-message"></div>
            <div id="successMessage" class="success-message"></div>
            
            <div id="inventoryContent"></div>
        </div>
    </div>

    <script>
        // Global variables
        let currentData = [];
        let currentFilters = {
            brand: '',
            model: '',
            capacity: '',
            carrier: ''
        };
        let allCapacityData = {}; // Store all capacity breakdown data

        // Initialize dashboard
        document.addEventListener('DOMContentLoaded', function() {
            loadFilterOptions();
            loadInventoryData();
            loadAllCapacityData(); // Load all capacity data upfront
        });

        // Load filter options
        async function loadFilterOptions() {
            try {
                const response = await fetch('/api/sku-inventory/filter-options');
                const result = await response.json();
                
                if (result.success) {
                    populateFilterOptions(result.options);
                } else {
                    showError('Failed to load filter options');
                }
            } catch (error) {
                console.error('Error loading filter options:', error);
                showError('Error loading filter options');
            }
        }

        // Populate filter dropdowns
        function populateFilterOptions(options) {
            // Brand filter
            const brandSelect = document.getElementById('brandFilter');
            brandSelect.innerHTML = '<option value="">All Brands</option>';
            options.brands.forEach(brand => {
                const option = document.createElement('option');
                option.value = brand;
                option.textContent = brand;
                brandSelect.appendChild(option);
            });

            // Model filter
            const modelSelect = document.getElementById('modelFilter');
            modelSelect.innerHTML = '<option value="">All Models</option>';
            options.models.forEach(model => {
                const option = document.createElement('option');
                option.value = model;
                option.textContent = model;
                modelSelect.appendChild(option);
            });

            // Capacity filter
            const capacitySelect = document.getElementById('capacityFilter');
            capacitySelect.innerHTML = '<option value="">All Capacities</option>';
            options.capacities.forEach(capacity => {
                const option = document.createElement('option');
                option.value = capacity;
                option.textContent = capacity;
                capacitySelect.appendChild(option);
            });

            // Carrier filter
            const carrierSelect = document.getElementById('carrierFilter');
            carrierSelect.innerHTML = '<option value="">All Carriers</option>';
            options.carriers.forEach(carrier => {
                const option = document.createElement('option');
                option.value = carrier;
                option.textContent = carrier;
                carrierSelect.appendChild(option);
            });
        }

        // Update current filters
        function updateFilters() {
            currentFilters.brand = document.getElementById('brandFilter').value;
            currentFilters.model = document.getElementById('modelFilter').value;
            currentFilters.capacity = document.getElementById('capacityFilter').value;
            currentFilters.carrier = document.getElementById('carrierFilter').value;
        }

        // Apply filters
        async function applyFilters() {
            updateFilters();
            await loadInventoryData();
        }

        // Clear all filters
        function clearFilters() {
            document.getElementById('brandFilter').value = '';
            document.getElementById('modelFilter').value = '';
            document.getElementById('capacityFilter').value = '';
            document.getElementById('carrierFilter').value = '';
            currentFilters = { brand: '', model: '', capacity: '', carrier: '' };
            loadInventoryData();
        }

        // Load all capacity breakdown data upfront
        async function loadAllCapacityData() {
            try {
                const response = await fetch('/api/sku-inventory/all-capacity-breakdown');
                const result = await response.json();
                
                if (result.success) {
                    allCapacityData = result.data;
                    console.log('✅ All capacity data loaded:', Object.keys(allCapacityData).length, 'models');
                } else {
                    console.error('❌ Failed to load capacity data:', result.error);
                }
            } catch (error) {
                console.error('❌ Error loading capacity data:', error);
            }
        }

        // Load inventory data
        async function loadInventoryData() {
            try {
                document.getElementById('loadingIndicator').style.display = 'block';
                document.getElementById('inventoryContent').innerHTML = '';
                document.getElementById('errorMessage').style.display = 'none';

                const params = new URLSearchParams();
                Object.keys(currentFilters).forEach(key => {
                    if (currentFilters[key]) {
                        params.append(key, currentFilters[key]);
                    }
                });

                const response = await fetch(`/api/sku-inventory/hierarchical-data?${params.toString()}`);
                const result = await response.json();

                if (result.success) {
                    currentData = result.data;
                    displayHierarchicalData(result.data);
                    updateSummaryCards(result.summary);
                } else {
                    showError('Failed to load inventory data: ' + result.error);
                }
            } catch (error) {
                console.error('Error loading inventory data:', error);
                showError('Error loading inventory data: ' + error.message);
            } finally {
                document.getElementById('loadingIndicator').style.display = 'none';
            }
        }

        // Display hierarchical data
        function displayHierarchicalData(data) {
            const container = document.getElementById('inventoryContent');
            container.innerHTML = '';

            if (!data || data.length === 0) {
                container.innerHTML = '<p style="text-align: center; color: #6c757d; padding: 40px;">No inventory data found</p>';
                return;
            }

            data.forEach(modelGroup => {
                const modelElement = createModelGroup(modelGroup);
                container.appendChild(modelElement);
            });
        }

        // Create model group element
        function createModelGroup(modelGroup) {
            const div = document.createElement('div');
            div.className = 'model-group';
            div.innerHTML = `
                <div class="model-header" onclick="toggleModel('${modelGroup.model}')">
                    <h3>${modelGroup.brand} ${modelGroup.model}</h3>
                    <div class="model-stats">
                        <div class="model-stat">
                            <span class="model-stat-number">${modelGroup.total_devices}</span>
                            <span class="model-stat-label">Total</span>
                        </div>
                        <div class="model-stat">
                            <span class="model-stat-number">${modelGroup.defective_count}</span>
                            <span class="model-stat-label">Defective</span>
                        </div>
                        <div class="model-stat">
                            <span class="model-stat-number">${modelGroup.defective_rate}%</span>
                            <span class="model-stat-label">Defect Rate</span>
                        </div>
                    </div>
                    <span class="expand-icon" id="icon-${modelGroup.model}">▼</span>
                </div>
                <div class="model-content" id="content-${modelGroup.model}">
                    ${createCapacityTabs(modelGroup.capacities, modelGroup.brand, modelGroup.model)}
                </div>
            `;
            return div;
        }

        // Create capacity tabs
        function createCapacityTabs(capacities, brand, model) {
            // Always try to load capacity data directly
            const modelKey = `${brand}-${model}`;
            const modelData = allCapacityData[modelKey];
            
            if (modelData && modelData.capacities) {
                // Convert capacities object to array
                const capacitiesArray = Object.values(modelData.capacities);
                return createCapacityTabsWithData(capacitiesArray, modelKey);
            } else {
                return `
                    <div class="capacity-tabs">
                        <div class="capacity-tab active">
                            📱 No Capacity Data Available
                        </div>
                    </div>
                    <div class="capacity-content active">
                        <p style="text-align: center; color: #6c757d; padding: 20px;">
                            📱 No capacity breakdown data available for this model
                        </p>
                    </div>
                `;
            }
        }

        // Create capacity tabs with actual data
        function createCapacityTabsWithData(capacities, modelKey) {
            if (!capacities || capacities.length === 0) {
                return `
                    <div class="capacity-tabs">
                        <div class="capacity-tab active">
                            📱 No Capacity Data
                        </div>
                    </div>
                    <div class="capacity-content active">
                        <p style="text-align: center; color: #6c757d; padding: 20px;">
                            📱 No capacity data available
                        </p>
                    </div>
                `;
            }

            const tabsHtml = capacities.map((capacity, index) => {
                // Calculate total devices from SKUs
                const totalDevices = Object.values(capacity.skus).reduce((sum, sku) => sum + (sku.total_devices || 0), 0);
                return `
                    <div class="capacity-tab ${index === 0 ? 'active' : ''}" 
                         onclick="selectCapacity('${capacity.capacity}', this, '${modelKey}')">
                        ${capacity.capacity} (${totalDevices})
                    </div>
                `;
            }).join('');

            const contentHtml = capacities.map((capacity, index) => `
                <div class="capacity-content ${index === 0 ? 'active' : ''}" id="capacity-${modelKey}-${capacity.capacity}">
                    ${createSkuGrid(capacity.skus)}
                </div>
            `).join('');

            return `
                <div class="capacity-tabs">
                    ${tabsHtml}
                </div>
                ${contentHtml}
            `;
        }

        // Create carrier grid
        function createCarrierGrid(carriers) {
            if (!carriers || carriers.length === 0) {
                return `
                    <div class="carrier-grid">
                        <div class="carrier-card">
                            <div class="carrier-header">
                                <span class="carrier-name">📡 Carrier Breakdown</span>
                                <span class="carrier-count">Coming Soon</span>
                            </div>
                            <div class="carrier-details">
                                <p style="text-align: center; color: #6c757d; margin: 10px 0;">
                                    Carrier-specific data will be available in the next update
                                </p>
                            </div>
                        </div>
                    </div>
                `;
            }

            return `
                <div class="carrier-grid">
                    ${carriers.map(carrier => `
                        <div class="carrier-card">
                            <div class="carrier-header">
                                <span class="carrier-name">${carrier.carrier}</span>
                                <span class="carrier-count">${carrier.deviceCount}</span>
                            </div>
                            <div class="carrier-details">
                                <div class="carrier-detail-row">
                                    <span>Total Devices:</span>
                                    <span>${carrier.deviceCount}</span>
                                </div>
                                <div class="carrier-detail-row">
                                    <span>Defective:</span>
                                    <span class="defective-badge">${carrier.defectiveCount} (${carrier.defectiveRate}%)</span>
                                </div>
                                <div class="carrier-detail-row">
                                    <span>Working:</span>
                                    <span>${carrier.workingCount}</span>
                                </div>
                                <div class="carrier-detail-row">
                                    <span>Not Working:</span>
                                    <span>${carrier.notWorkingCount}</span>
                                </div>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // Toggle model expansion
        function toggleModel(model) {
            const content = document.getElementById(`content-${model}`);
            const icon = document.getElementById(`icon-${model}`);
            
            if (content.classList.contains('expanded')) {
                content.classList.remove('expanded');
                icon.classList.remove('expanded');
            } else {
                content.classList.add('expanded');
                icon.classList.add('expanded');
                
                // Auto-activate the first capacity tab when expanding
                setTimeout(() => {
                    const firstTab = content.querySelector('.capacity-tab');
                    const firstContent = content.querySelector('.capacity-content');
                    
                    if (firstTab && firstContent) {
                        // Remove active class from all tabs and content
                        content.querySelectorAll('.capacity-tab').forEach(tab => tab.classList.remove('active'));
                        content.querySelectorAll('.capacity-content').forEach(content => content.classList.remove('active'));
                        
                        // Add active class to first tab and content
                        firstTab.classList.add('active');
                        firstContent.classList.add('active');
                    }
                }, 100); // Small delay to ensure DOM is updated
            }
        }


        // Create SKU grid showing grouped SKUs
        function createSkuGrid(skus) {
            if (!skus || Object.keys(skus).length === 0) {
                return '<p style="text-align: center; color: #6c757d; padding: 20px;">No SKUs found</p>';
            }

            return `
                <div class="device-grid">
                    ${Object.values(skus).map(sku => `
                        <div class="device-card sku-card" onclick="showCarrierPopup('${sku.sku}', ${JSON.stringify(sku.carriers).replace(/"/g, '&quot;')})">
                            <div class="device-header">
                                <span class="device-sku">${sku.sku}</span>
                                <span class="device-count">${sku.total_devices} devices</span>
                            </div>
                            <div class="device-details">
                                <div class="device-detail">
                                    <span class="detail-label">Brand:</span>
                                    <span class="detail-value">${sku.brand}</span>
                                </div>
                                <div class="device-detail">
                                    <span class="detail-label">Model:</span>
                                    <span class="detail-value">${sku.model}</span>
                                </div>
                                <div class="device-detail">
                                    <span class="detail-label">Capacity:</span>
                                    <span class="detail-value">${sku.capacity || 'Unknown'}</span>
                                </div>
                                <div class="device-detail">
                                    <span class="detail-label">Color:</span>
                                    <span class="detail-value">${sku.color || 'Unknown'}</span>
                                </div>
                                <div class="device-detail">
                                    <span class="detail-label">Carriers:</span>
                                    <span class="detail-value">${sku.carriers.length} different</span>
                                </div>
                                <div class="device-detail">
                                    <span class="detail-label">Defective:</span>
                                    <span class="detail-value text-success">0 (0%)</span>
                                </div>
                            </div>
                            <div class="sku-click-hint">
                                <small style="color: #6c757d;">Click to see carrier breakdown</small>
                            </div>
                        </div>
                    `).join('')}
                </div>
            `;
        }

        // Show carrier popup
        function showCarrierPopup(sku, carriers) {
            const popup = document.createElement('div');
            popup.className = 'carrier-popup-overlay';
            popup.innerHTML = `
                <div class="carrier-popup">
                    <div class="carrier-popup-header">
                        <h3>${sku}</h3>
                        <button class="close-popup" onclick="closeCarrierPopup()">&times;</button>
                    </div>
                    <div class="carrier-popup-content">
                        <div class="carrier-list">
                            ${carriers.map(carrier => `
                                <div class="carrier-item">
                                    <div class="carrier-info">
                                        <span class="carrier-name">${carrier.carrier}</span>
                                        <span class="carrier-count">${carrier.device_count} devices</span>
                                    </div>
                                    <div class="carrier-notes">
                                        <span class="notes-label">Device Notes:</span>
                                        <span class="notes-value">${carrier.device_notes || 'No notes available'}</span>
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    </div>
                </div>
            `;
            
            document.body.appendChild(popup);
            
            // Close popup when clicking outside
            popup.addEventListener('click', function(e) {
                if (e.target === popup) {
                    closeCarrierPopup();
                }
            });
        }

        // Close carrier popup
        function closeCarrierPopup() {
            const popup = document.querySelector('.carrier-popup-overlay');
            if (popup) {
                popup.remove();
            }
        }

        // Select capacity tab
        function selectCapacity(capacity, tabElement, modelKey) {
            // Find the parent model container to scope the selection
            const modelContainer = tabElement.closest('.model-content');
            if (!modelContainer) return;
            
            // Remove active class from all tabs and contents within this model only
            const modelTabs = modelContainer.querySelectorAll('.capacity-tab');
            const modelContents = modelContainer.querySelectorAll('.capacity-content');
            
            modelTabs.forEach(tab => tab.classList.remove('active'));
            modelContents.forEach(content => content.classList.remove('active'));
            
            // Add active class to selected tab and content
            tabElement.classList.add('active');
            const content = document.getElementById(`capacity-${modelKey}-${capacity}`);
            if (content) {
                content.classList.add('active');
            }
        }

        // Update summary cards
        function updateSummaryCards(summary) {
            document.getElementById('totalModels').textContent = summary.total_models || 0;
            document.getElementById('totalDevices').textContent = summary.total_devices || 0;
            document.getElementById('totalDefective').textContent = summary.total_defective || 0;
            document.getElementById('defectiveRate').textContent = (summary.defective_rate || 0) + '%';
        }

        // Show error message
        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.style.display = 'block';
            setTimeout(() => {
                errorDiv.style.display = 'none';
            }, 5000);
        }

        // Show success message
        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.style.display = 'block';
            setTimeout(() => {
                successDiv.style.display = 'none';
            }, 3000);
        }
    </script>
</body>
</html>
