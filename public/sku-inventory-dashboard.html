<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKU Inventory Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
            color: white;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            text-align: center;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }

        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: #667eea;
            margin-bottom: 5px;
        }

        .stat-label {
            color: #666;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .brand-tabs {
            background: white;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
        }

        .tab-header {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .tab-button {
            padding: 12px 24px;
            border: 2px solid #667eea;
            background: transparent;
            color: #667eea;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            font-size: 0.9rem;
        }

        .tab-button:hover {
            background: #667eea;
            color: white;
            transform: translateY(-2px);
        }

        .tab-button.active {
            background: #667eea;
            color: white;
            box-shadow: 0 4px 15px rgba(102, 126, 234, 0.3);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .inventory-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .inventory-table th {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            padding: 15px 12px;
            text-align: left;
            font-weight: 600;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .inventory-table td {
            padding: 15px 12px;
            border-bottom: 1px solid #f0f0f0;
            vertical-align: middle;
        }

        .inventory-table tr:hover {
            background: #f8f9ff;
        }

        .inventory-table tr:last-child td {
            border-bottom: none;
        }

        .sku-code {
            font-family: 'Courier New', monospace;
            background: #f0f0f0;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            color: #333;
        }

        .device-count {
            font-weight: bold;
            color: #667eea;
        }

        .working-count {
            color: #28a745;
            font-weight: 600;
        }

        .failed-count {
            color: #dc3545;
            font-weight: 600;
        }

        .capacity-badge {
            background: #e9ecef;
            color: #495057;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .color-badge {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 500;
            color: white;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.3);
        }

        .carrier-badge {
            background: #17a2b8;
            color: white;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .loading {
            text-align: center;
            padding: 50px;
            color: white;
            font-size: 1.2rem;
        }

        .error {
            background: #dc3545;
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin: 20px 0;
            text-align: center;
        }

        .empty-state {
            text-align: center;
            padding: 50px;
            color: #666;
            font-style: italic;
        }

        .differences-btn {
            background: #17a2b8;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 15px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .differences-btn:hover {
            background: #138496;
            transform: translateY(-1px);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.5);
            backdrop-filter: blur(5px);
        }

        .modal-content {
            background: white;
            margin: 5% auto;
            padding: 30px;
            border-radius: 15px;
            width: 90%;
            max-width: 800px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #f0f0f0;
        }

        .modal-title {
            font-size: 1.5rem;
            color: #333;
            font-weight: 600;
        }

        .close {
            color: #aaa;
            font-size: 28px;
            font-weight: bold;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .close:hover {
            color: #333;
        }

        .differences-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .difference-card {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 10px;
            padding: 15px;
        }

        .difference-field {
            font-weight: 600;
            color: #495057;
            margin-bottom: 8px;
        }

        .difference-values {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .difference-value {
            background: white;
            border: 1px solid #dee2e6;
            border-radius: 6px;
            padding: 4px 8px;
            font-size: 0.85rem;
        }

        .device-list {
            margin-top: 20px;
        }

        .device-item {
            background: #f8f9fa;
            border: 1px solid #e9ecef;
            border-radius: 8px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .device-info {
            flex: 1;
        }

        .device-imei {
            font-family: 'Courier New', monospace;
            font-weight: 600;
            color: #495057;
        }

        .device-specs {
            font-size: 0.9rem;
            color: #6c757d;
            margin-top: 4px;
        }

        .device-status {
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 500;
        }

        .status-working {
            background: #d4edda;
            color: #155724;
        }

        .status-failed {
            background: #f8d7da;
            color: #721c24;
        }

        .search-container {
            margin-bottom: 20px;
        }

        .search-input {
            width: 100%;
            padding: 12px 20px;
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .search-input:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        @media (max-width: 768px) {
            .container {
                padding: 10px;
            }
            
            .header h1 {
                font-size: 2rem;
            }
            
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .tab-header {
                justify-content: center;
            }
            
            .tab-button {
                padding: 10px 16px;
                font-size: 0.8rem;
            }
            
            .inventory-table {
                font-size: 0.85rem;
            }
            
            .inventory-table th,
            .inventory-table td {
                padding: 10px 8px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>SKU Inventory Dashboard</h1>
            <p>Real-time inventory tracking with brand-based organization</p>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <div class="stat-number" id="totalDevices">-</div>
                <div class="stat-label">Total Devices</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalSKUs">-</div>
                <div class="stat-label">Unique SKUs</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalBrands">-</div>
                <div class="stat-label">Brands</div>
            </div>
            <div class="stat-card">
                <div class="stat-number" id="totalModels">-</div>
                <div class="stat-label">Models</div>
            </div>
        </div>

        <div class="search-container">
            <input type="text" class="search-input" id="searchInput" placeholder="Search SKUs, models, or specifications...">
        </div>

        <div class="brand-tabs">
            <div class="tab-header" id="tabHeader">
                <!-- Brand tabs will be generated here -->
            </div>
            <div id="tabContent">
                <!-- Tab content will be generated here -->
            </div>
        </div>
    </div>

    <!-- Differences Modal -->
    <div id="differencesModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 class="modal-title" id="modalTitle">Device Differences</h2>
                <span class="close">&times;</span>
            </div>
            <div id="modalBody">
                <!-- Modal content will be populated here -->
            </div>
        </div>
    </div>

    <script>
        class SKUInventoryDashboard {
            constructor() {
                this.allData = {};
                this.filteredData = {};
                this.currentBrand = null;
                this.searchTerm = '';
                
                this.initializeEventListeners();
                this.loadData();
            }

            initializeEventListeners() {
                document.getElementById('searchInput').addEventListener('input', (e) => {
                    this.searchTerm = e.target.value.toLowerCase();
                    this.applyFilters();
                });

                // Modal event listeners
                const modal = document.getElementById('differencesModal');
                const closeBtn = document.querySelector('.close');
                
                closeBtn.onclick = () => modal.style.display = 'none';
                window.onclick = (event) => {
                    if (event.target === modal) {
                        modal.style.display = 'none';
                    }
                };
            }

            async loadData() {
                try {
                    this.showLoading();
                    
                    const response = await fetch('/api/sku-inventory/all-capacity-breakdown');
                    const result = await response.json();
                    
                    if (!result.success) {
                        throw new Error(result.error || 'Failed to load data');
                    }
                    
                    this.allData = this.processData(result.data);
                    this.filteredData = { ...this.allData };
                    
                    this.updateStats();
                    this.renderBrandTabs();
                    this.renderCurrentTab();
                    this.hideLoading();
                    
                } catch (error) {
                    console.error('Error loading data:', error);
                    this.showError('Failed to load inventory data: ' + error.message);
                }
            }

            processData(rawData) {
                const processedData = {};
                
                for (const [modelKey, modelData] of Object.entries(rawData)) {
                    const brand = modelData.brand;
                    
                    if (!processedData[brand]) {
                        processedData[brand] = [];
                    }
                    
                    // Process each capacity
                    for (const [capacity, capacityData] of Object.entries(modelData.capacities)) {
                        // Process each SKU in this capacity
                        for (const [skuKey, skuData] of Object.entries(capacityData.skus)) {
                            const inventoryRow = {
                                brand: brand,
                                model: modelData.model,
                                originalModels: modelData.original_models || [],
                                capacity: capacity,
                                color: skuData.color || 'Unknown',
                                carrier: 'Mixed', // Will be determined from device_details
                                sku: skuData.sku,
                                deviceCount: skuData.total_devices || 0,
                                workingCount: skuData.working_devices || 0,
                                failedCount: skuData.failed_devices || 0,
                                deviceDetails: skuData.device_details || []
                            };
                            
                            processedData[brand].push(inventoryRow);
                        }
                    }
                }
                
                // Sort each brand's data
                Object.keys(processedData).forEach(brand => {
                    processedData[brand].sort((a, b) => {
                        if (a.model !== b.model) return a.model.localeCompare(b.model);
                        if (a.capacity !== b.capacity) return a.capacity.localeCompare(b.capacity);
                        return a.color.localeCompare(b.color);
                    });
                });
                
                return processedData;
            }

            updateStats() {
                const brands = Object.keys(this.allData);
                const allRows = Object.values(this.allData).flat();
                
                document.getElementById('totalDevices').textContent = 
                    allRows.reduce((sum, row) => sum + row.deviceCount, 0);
                document.getElementById('totalSKUs').textContent = allRows.length;
                document.getElementById('totalBrands').textContent = brands.length;
                document.getElementById('totalModels').textContent = 
                    new Set(allRows.map(row => `${row.brand}-${row.model}`)).size;
            }

            renderBrandTabs() {
                const tabHeader = document.getElementById('tabHeader');
                const brands = Object.keys(this.allData).sort();
                
                tabHeader.innerHTML = '';
                
                brands.forEach((brand, index) => {
                    const tabButton = document.createElement('button');
                    tabButton.className = `tab-button ${index === 0 ? 'active' : ''}`;
                    tabButton.textContent = `${brand} (${this.allData[brand].length})`;
                    tabButton.onclick = () => this.switchTab(brand, tabButton);
                    
                    tabHeader.appendChild(tabButton);
                });
                
                // Set first brand as active
                if (brands.length > 0) {
                    this.currentBrand = brands[0];
                }
            }

            switchTab(brand, button) {
                // Update active tab button
                document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
                button.classList.add('active');
                
                this.currentBrand = brand;
                this.renderCurrentTab();
            }

            renderCurrentTab() {
                const tabContent = document.getElementById('tabContent');
                
                if (!this.currentBrand || !this.filteredData[this.currentBrand]) {
                    tabContent.innerHTML = '<div class="empty-state">No data available for this brand.</div>';
                    return;
                }
                
                const brandData = this.filteredData[this.currentBrand];
                
                if (brandData.length === 0) {
                    tabContent.innerHTML = '<div class="empty-state">No matching inventory found.</div>';
                    return;
                }
                
                tabContent.innerHTML = `
                    <table class="inventory-table">
                        <thead>
                            <tr>
                                <th>SKU Code</th>
                                <th>Model</th>
                                <th>Capacity</th>
                                <th>Color</th>
                                <th>Carrier</th>
                                <th>Total Devices</th>
                                <th>Working</th>
                                <th>Failed</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${brandData.map(row => `
                                <tr>
                                    <td>
                                        <span class="sku-code">${row.sku}</span>
                                        ${row.originalModels.length > 1 ? `<br><small style="color: #666;">(${row.originalModels.join(', ')})</small>` : ''}
                                    </td>
                                    <td><strong>${row.model}</strong></td>
                                    <td><span class="capacity-badge">${row.capacity}</span></td>
                                    <td><span class="color-badge" style="background-color: ${this.getColorCode(row.color)}">${row.color}</span></td>
                                    <td>
                                        ${row.deviceDetails.length > 1 ? 
                                            `<span class="carrier-badge">Mixed (${new Set(row.deviceDetails.map(d => d.carrier)).size})</span>` :
                                            `<span class="carrier-badge">${row.deviceDetails[0]?.carrier || 'Unlocked'}</span>`
                                        }
                                    </td>
                                    <td><span class="device-count">${row.deviceCount}</span></td>
                                    <td><span class="working-count">${row.workingCount}</span></td>
                                    <td><span class="failed-count">${row.failedCount}</span></td>
                                    <td>
                                        <button class="differences-btn" onclick="dashboard.showDifferences('${row.sku}')">
                                            View Differences
                                        </button>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            }

            applyFilters() {
                this.filteredData = {};
                
                Object.keys(this.allData).forEach(brand => {
                    this.filteredData[brand] = this.allData[brand].filter(row => {
                        if (!this.searchTerm) return true;
                        
                        const searchText = `${row.sku} ${row.model} ${row.capacity} ${row.color} ${row.carrier}`.toLowerCase();
                        return searchText.includes(this.searchTerm);
                    });
                });
                
                this.updateStats();
                this.renderBrandTabs();
                this.renderCurrentTab();
            }

            getColorCode(color) {
                const colorMap = {
                    'black': '#000000',
                    'white': '#ffffff',
                    'blue': '#007bff',
                    'red': '#dc3545',
                    'green': '#28a745',
                    'yellow': '#ffc107',
                    'purple': '#6f42c1',
                    'pink': '#e83e8c',
                    'orange': '#fd7e14',
                    'silver': '#6c757d',
                    'gold': '#ffd700',
                    'space gray': '#343a40',
                    'midnight': '#000000',
                    'starlight': '#f8f9fa'
                };
                
                return colorMap[color.toLowerCase()] || '#6c757d';
            }

            showLoading() {
                document.getElementById('tabContent').innerHTML = '<div class="loading">Loading inventory data...</div>';
            }

            hideLoading() {
                // Loading will be replaced by actual content
            }

            showError(message) {
                document.getElementById('tabContent').innerHTML = `<div class="error">${message}</div>`;
            }

            async showDifferences(sku) {
                try {
                    const response = await fetch(`/api/sku-inventory/sku-differences/${encodeURIComponent(sku)}`);
                    const result = await response.json();
                    
                    if (!result.success) {
                        throw new Error(result.error || 'Failed to load differences');
                    }
                    
                    const data = result.data;
                    const modal = document.getElementById('differencesModal');
                    const modalTitle = document.getElementById('modalTitle');
                    const modalBody = document.getElementById('modalBody');
                    
                    modalTitle.textContent = `Device Differences - ${sku}`;
                    
                    let differencesHtml = '';
                    
                    if (data.differences.length > 0) {
                        differencesHtml = `
                            <h3>Key Differences Found</h3>
                            <div class="differences-grid">
                                ${data.differences.map(diff => `
                                    <div class="difference-card">
                                        <div class="difference-field">${diff.differences[0].field}</div>
                                        <div class="difference-values">
                                            <div class="difference-value">${diff.differences[0].device1}</div>
                                            <div class="difference-value">${diff.differences[0].device2}</div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        `;
                    } else {
                        differencesHtml = '<p style="text-align: center; color: #666; font-style: italic;">No differences found between devices in this SKU group.</p>';
                    }
                    
                    modalBody.innerHTML = `
                        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 20px; margin-bottom: 20px;">
                            <div style="background: #e3f2fd; padding: 15px; border-radius: 8px; text-align: center;">
                                <div style="font-size: 1.5rem; font-weight: bold; color: #1976d2;">${data.device_count}</div>
                                <div style="color: #666; font-size: 0.9rem;">Total Devices</div>
                            </div>
                            <div style="background: #e8f5e8; padding: 15px; border-radius: 8px; text-align: center;">
                                <div style="font-size: 1.5rem; font-weight: bold; color: #2e7d32;">${data.summary.working_count}</div>
                                <div style="color: #666; font-size: 0.9rem;">Working</div>
                            </div>
                            <div style="background: #ffebee; padding: 15px; border-radius: 8px; text-align: center;">
                                <div style="font-size: 1.5rem; font-weight: bold; color: #c62828;">${data.summary.failed_count}</div>
                                <div style="color: #666; font-size: 0.9rem;">Failed</div>
                            </div>
                        </div>
                        
                        ${differencesHtml}
                        
                        <h3>Individual Devices</h3>
                        <div class="device-list">
                            ${data.devices.map(device => `
                                <div class="device-item">
                                    <div class="device-info">
                                        <div class="device-imei">${device.imei}</div>
                                        <div class="device-specs">
                                            ${device.original_model} • ${device.capacity} • ${device.color} • ${device.carrier}
                                            ${device.device_notes ? `<br><small style="color: #999;">Notes: ${device.device_notes}</small>` : ''}
                                        </div>
                                    </div>
                                    <div class="device-status ${device.status === 'Working' ? 'status-working' : 'status-failed'}">
                                        ${device.status}
                                    </div>
                                </div>
                            `).join('')}
                        </div>
                    `;
                    
                    modal.style.display = 'block';
                    
                } catch (error) {
                    console.error('Error loading differences:', error);
                    alert('Failed to load device differences: ' + error.message);
                }
            }
        }

        // Initialize the dashboard when the page loads
        let dashboard;
        document.addEventListener('DOMContentLoaded', () => {
            dashboard = new SKUInventoryDashboard();
        });
    </script>
</body>
</html>
