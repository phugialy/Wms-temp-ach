<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk Add Audit History</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .status-complete { color: #10b981; }
        .status-failed { color: #ef4444; }
        .status-partial { color: #f59e0b; }
        .status-in-progress { color: #6366f1; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function BulkAddAuditViewer() {
            const [history, setHistory] = useState([]);
            const [statistics, setStatistics] = useState(null);
            const [stations, setStations] = useState([]);
            const [selectedStation, setSelectedStation] = useState('');
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);

            const fetchAuditData = async (station = '') => {
                setLoading(true);
                setError(null);
                
                try {
                    // Fetch history
                    const historyUrl = station 
                        ? `/api/bulk-add-audit/history?station=${station}&limit=100`
                        : '/api/bulk-add-audit/history?limit=100';
                    
                    const [historyRes, statsRes, stationsRes] = await Promise.all([
                        fetch(historyUrl),
                        fetch('/api/bulk-add-audit/statistics'),
                        fetch('/api/bulk-add-audit/stations')
                    ]);

                    if (historyRes.ok) {
                        const historyData = await historyRes.json();
                        setHistory(historyData.data.history);
                    }

                    if (statsRes.ok) {
                        const statsData = await statsRes.json();
                        setStatistics(statsData.data);
                    }

                    if (stationsRes.ok) {
                        const stationsData = await stationsRes.json();
                        setStations(stationsData.data.stations);
                    }

                } catch (err) {
                    setError('Failed to fetch audit data: ' + err.message);
                    console.error('Error fetching audit data:', err);
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                fetchAuditData();
            }, []);

            const handleStationFilter = (station) => {
                setSelectedStation(station);
                fetchAuditData(station);
            };

            const formatStatus = (status) => {
                const statusMap = {
                    'COMPLETE': '🟢 COMPLETE',
                    'FAILED': '🔴 FAILED', 
                    'PARTIAL': '🟡 PARTIAL',
                    'IN_PROGRESS': '🔄 IN_PROGRESS'
                };
                return statusMap[status] || status;
            };

            const formatDate = (dateStr) => {
                return new Date(dateStr).toLocaleString();
            };

            if (loading) {
                return (
                    <div className="min-h-screen bg-gray-100 flex items-center justify-center">
                        <div className="text-center">
                            <div className="animate-spin rounded-full h-32 w-32 border-b-2 border-blue-600 mx-auto"></div>
                            <p className="mt-4 text-gray-600">Loading audit history...</p>
                        </div>
                    </div>
                );
            }

            if (error) {
                return (
                    <div className="min-h-screen bg-gray-100 flex items-center justify-center">
                        <div className="bg-red-100 border border-red-400 text-red-700 px-4 py-3 rounded">
                            <strong className="font-bold">Error:</strong>
                            <span className="block sm:inline"> {error}</span>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-gray-100">
                    <div className="container mx-auto px-4 py-8">
                        <h1 className="text-3xl font-bold text-gray-800 mb-8">📊 Bulk Add Audit History</h1>
                        
                        {/* Statistics Cards */}
                        {statistics && (
                            <div className="grid grid-cols-1 md:grid-cols-4 gap-4 mb-8">
                                <div className="bg-white rounded-lg shadow p-6">
                                    <div className="text-2xl font-bold text-blue-600">{statistics.total_operations || 0}</div>
                                    <div className="text-gray-600">Total Operations</div>
                                </div>
                                <div className="bg-white rounded-lg shadow p-6">
                                    <div className="text-2xl font-bold text-green-600">{statistics.complete_operations || 0}</div>
                                    <div className="text-gray-600">Successful</div>
                                </div>
                                <div className="bg-white rounded-lg shadow p-6">
                                    <div className="text-2xl font-bold text-red-600">{statistics.failed_operations || 0}</div>
                                    <div className="text-gray-600">Failed</div>
                                </div>
                                <div className="bg-white rounded-lg shadow p-6">
                                    <div className="text-2xl font-bold text-purple-600">{statistics.total_devices_processed || 0}</div>
                                    <div className="text-gray-600">Total Devices</div>
                                </div>
                            </div>
                        )}

                        {/* Station Filter */}
                        <div className="bg-white rounded-lg shadow p-6 mb-6">
                            <h2 className="text-xl font-semibold mb-4">Filter by Station</h2>
                            <div className="flex flex-wrap gap-2">
                                <button
                                    onClick={() => handleStationFilter('')}
                                    className={`px-4 py-2 rounded ${selectedStation === '' ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`}
                                >
                                    All Stations ({stations.length})
                                </button>
                                {stations.map(station => (
                                    <button
                                        key={station}
                                        onClick={() => handleStationFilter(station)}
                                        className={`px-4 py-2 rounded ${selectedStation === station ? 'bg-blue-600 text-white' : 'bg-gray-200 text-gray-700 hover:bg-gray-300'}`}
                                    >
                                        {station}
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* History Table */}
                        <div className="bg-white rounded-lg shadow overflow-hidden">
                            <div className="px-6 py-4 border-b border-gray-200">
                                <h2 className="text-xl font-semibold">Operation History</h2>
                                <p className="text-gray-600">Showing {history.length} records</p>
                            </div>
                            
                            <div className="overflow-x-auto">
                                <table className="min-w-full divide-y divide-gray-200">
                                    <thead className="bg-gray-50">
                                        <tr>
                                            <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Date & Time</th>
                                            <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Station</th>
                                            <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Location</th>
                                            <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Devices</th>
                                            <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                                            <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Processing Time</th>
                                            <th className="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Session ID</th>
                                        </tr>
                                    </thead>
                                    <tbody className="bg-white divide-y divide-gray-200">
                                        {history.map((record, index) => (
                                            <tr key={index} className={index % 2 === 0 ? 'bg-white' : 'bg-gray-50'}>
                                                <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                                                    {formatDate(record.trigger_date_formatted)}
                                                </td>
                                                <td className="px-6 py-4 whitespace-nowrap text-sm font-medium text-gray-900">
                                                    {record.station}
                                                </td>
                                                <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                                    {record.location}
                                                </td>
                                                <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-900">
                                                    <div className="flex flex-col">
                                                        <span className="font-medium">{record.total_devices}</span>
                                                        <span className="text-xs text-gray-500">
                                                            ✅ {record.successful_devices} | ❌ {record.failed_devices}
                                                        </span>
                                                    </div>
                                                </td>
                                                <td className="px-6 py-4 whitespace-nowrap">
                                                    <span className={`text-sm font-medium ${record.status.toLowerCase().replace('_', '-')}`}>
                                                        {formatStatus(record.status)}
                                                    </span>
                                                </td>
                                                <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                                                    {record.processing_time_seconds}s
                                                </td>
                                                <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-500 font-mono">
                                                    {record.session_id}
                                                </td>
                                            </tr>
                                        ))}
                                    </tbody>
                                </table>
                            </div>
                            
                            {history.length === 0 && (
                                <div className="text-center py-12">
                                    <p className="text-gray-500">No audit records found.</p>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }

        ReactDOM.render(<BulkAddAuditViewer />, document.getElementById('root'));
    </script>
</body>
</html>
